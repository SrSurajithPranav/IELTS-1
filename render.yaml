databases:
  - name: ielts-db
    databaseName: ielts
    plan: free
    region: singapore

services:

  - type: web
    name: ielts-backend
    plan: free
    region: singapore
    runtime: python
    rootDir: IELTS
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate_db.py && gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ielts-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://ielts-frontend.onrender.com
      - key: FRONTEND_BASE_URL
        value: https://ielts-frontend.onrender.com
      - key: REQUIRE_LOGIN_APPROVAL
        value: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: web
    name: ielts-frontend
    plan: free
    region: singapore
    runtime: node
    rootDir: IELTS
    buildCommand: npm install && npm run build
    startCommand: npx serve dist -l $PORT
    envVars:
      - key: VITE_API_URL
        value: https://ielts-backend.onrender.com