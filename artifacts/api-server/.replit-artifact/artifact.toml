kind = "api"
previewPath = "/api"
title = "IELTS API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd python && python app.py"

[services.production.build]
args = ["python", "-m", "compileall", "python"]

[services.production.build.env]
FLASK_ENV = "production"

[services.production.run]
args = ["gunicorn", "--chdir", "python", "--bind", "0.0.0.0:8080", "app:app"]

[services.production.run.env]
PORT = "8080"
FLASK_ENV = "production"
FLASK_DEBUG = "0"
