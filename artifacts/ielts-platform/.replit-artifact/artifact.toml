kind = "web"
previewPath = "/"
title = "IELTS Learning Platform"
description = "A full IELTS practice platform for students and teachers with authentic reading, listening, writing, speaking, progress, feedback, and administration workflows."
version = "1.0.0"
id = "artifacts/ielts-platform"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22002

[services.development]
run = "pnpm --filter @workspace/ielts-platform run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ielts-platform", "run", "build" ]
serve = "static"
publicDir = "artifacts/ielts-platform/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22002"
BASE_PATH = "/"
